<!DOCTYPE html> <!--Document Type Declaration: Specifies the HTML version and type of document being used-->
<html lang="en"> <!--HTML Element: The root element of the HTML document, with the language attribute set to English-->
<head> <!--Head Section: Contains metadata and links to stylesheets and scripts for the document-->
<meta name="description" content="Browse the House of Aura Living product gallery featuring natural scented candles, room sprays, diffusers, and gift sets.">
<meta charset="UTF-8"> <!--Character Encoding: Specifies the character encoding for the document as UTF-8-->
<meta name="viewport" 
content="width=device-width, initial-scale=1.0"> <!--Viewport Meta Tag: Ensures the website is responsive and scales correctly on different devices-->
<title>Product Gallery | House of Aura Living</title>  
<link rel="stylesheet" href="CSS/style.css"> <!--Link Element: Links the external CSS stylesheet to the HTML document for styling purposes-->
</head>
<body> <!--Body Section: Contains the main content of the product gallery page-->
<header> <!--Header Section: Contains the logo, title, and navigation links-->
    <div class="header-container"> <!--Header Container: Holds the header elements and applies flexbox layout-->
    <div class="header-top"> <!--Header Top Section: Contains the logo and title of the website-->
    <div class="logo"><img src="images/logo.png" alt="Logo"></div> <!--Logo Section: Displays the company logo image-->
    <div class="title"><h1>House of Aura Living</h1></div> <!--Title Section: Displays the main title of the website-->
    </div>
    </div>
    <hr>
    <nav>
    <ul class="nav-bar"><!--Navigation Section: Contains the navigation links to different pages of the website-->
    <li><a href="home.html">Home</a></li>
    <li><a href="about.html">About Us</a></li>
    <li><a href="service.html">Services</a></li>
    <li><a href="gallery.html">Product Gallery</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</nav>
</header>
<main id="main-content"> <!--Main Content Section: Contains the primary content for the product gallery page-->
    <section style="text-align: center;"> <!--Section Element: Groups related content together for better organization and styling-->
        <h2 >Signature Fragrance and Product Gallery</h2>
        <p>Explore our curated selection of sustainable home goods designed to enhance your living space.</p>
        <div class="gallery"> <!--Gallery Container: Holds the product items and applies flexbox layout for responsive design-->
            <figure class="product"> <!--Product Item: Represents an individual product in the gallery-->
                <img src="images/candles.png" alt="Different Scented Candle">
                <figcaption> <!--Figcaption Element: Provides a caption for the product image, describing the category of the product-->
                    <strong>Category: Scented Candle</strong> 
                </figcaption>
                <p>Our Scented Candles are crafted with natural ingredients and designed to fill your space with a delightful fragrance.</p>
                <p class="price">Price: R150</p>
            </figure>
            <figure class="product">
                <img src="images/sprays.png" alt="Room Spray">
                <figcaption>
                    <strong>Category: Room Spray</strong>
                </figcaption>
                <p>Our Room Sprays are formulated to freshen your space and leave a pleasant scent behind.</p>
                <p class="price">Price: R120</p>
            </figure>
            <figure class="product">
                <img src="images/wax.png" alt="Wax Melts">
                <figcaption>
                    <strong>Category: Wax Melts</strong>
                </figcaption>
                <p>Our Wax Melts are designed to provide a long-lasting fragrance that fills your space with warmth and comfort.</p>
                <p class="price">Price: R100</p>
            </figure>
            <figure class="product">
                <img src="images/diffuser.png" alt="Home Diffuser">
                <figcaption>
                    <strong>Category: Home Diffuser</strong>
                </figcaption>
                <p>Our Home Diffusers are designed to disperse fragrance evenly throughout your space.</p>
                <p class="price">Price: R200</p>
            </figure>
            <figure class="product">
                <img src="images/giftSets.png" alt="Personalized Gift Set">
                <figcaption>
                    <strong>Category: Gift Set</strong>
                </figcaption>
                <p>Our Personalized Gift Sets are perfect for any occasion, allowing you to create a unique present.</p>    
                <p class="price">Price: R300</p>
            </figure>
        </div>
    </section>
</main>
<footer> <!--Footer Section: Contains the footer content of the website, including copyright information-->
<hr>

    <script src="js/filter.js"></script>
</body>
</html> <!--End of Product Gallery Page HTML Structure and Styling-->
